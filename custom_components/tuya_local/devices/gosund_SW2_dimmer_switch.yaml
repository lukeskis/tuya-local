name: Dimmer switch
products:
  - id: qcgkaqmaivuwfwz4
    manufacturer: Gosund
    model: SW2-AR
entities:
  - entity: light
    separate_brightness_message: true
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: integer
        name: brightness
        range:
          min: 25
          max: 255
  - entity: binary_sensor
    name: Temperature alarm
    class: heat
    category: diagnostic
    dps:
      - id: 101
        type: boolean
        name: sensor
        optional: true
